[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "julius"
version = "0.2.8a2"
description = "Nice DSP sweets: resampling, FFT Convolutions. All with PyTorch, differentiable and with CUDA support."
readme = "README.md"
requires-python = ">=3.9.0"
license = { text = "MIT License" }
authors = [
    { name = "Alexandre Défossez", email = "alexandre.defossez@gmail.com" },
]
dependencies = ["torch>=1.13.0"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/adefossez/julius"

[project.optional-dependencies]
dev = [
    "coverage",
    "flake8",
    "mypy",
    "onnx",
    "pdoc3",
    "resampy==0.4.3",
    # onnxruntime dropped cp38/cp39 wheels at 1.20; cap it for old Pythons.
    "onnxruntime; python_version >= '3.10'",
    "onnxruntime<1.20; python_version < '3.10'",
]

[tool.hatch.build.targets.wheel]
packages = ["julius"]

[tool.hatch.build.targets.sdist]
include = [
    "julius",
    "tests",
    "bench",
    "README.md",
    "LICENSE",
]
# docs/ holds generated HTML and is gitignored; force it into the sdist
# to match the previous MANIFEST.in behavior.
artifacts = ["docs/*/*.html"]
